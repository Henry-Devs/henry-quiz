<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plan de estudios Full Stack — Henry</title>
  <meta name="robots" content="noindex" />
  <script charset="utf-8" type="text/javascript" src="//js.hsforms.net/forms/embed/v2.js"></script>
  <!--
    Landing para creadores de contenido: el plan de estudios de Full Stack detrás de un
    formulario. El form de HubSpot (ed490c0e…) pide nombre, apellido, WhatsApp y mail, y
    recién después muestra el link al programa. No se linkea desde ningún otro lado del
    sitio: se llega sólo con el link (y la UTM) que se le da a cada creador.
  -->
  <style>
    @font-face { font-family: 'Satoshi'; src: url('fonts/Satoshi-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'Satoshi'; src: url('fonts/Satoshi-Medium.woff2') format('woff2'); font-weight: 500; font-display: swap; }
    @font-face { font-family: 'Satoshi'; src: url('fonts/Satoshi-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
    :root {
      --yellow: #FFFF00;
      --ink: #222222;
      --muted: #5f5f5f;
      --line: #e5e5e2;
      --surface: rgba(255, 255, 255, 0.78);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #ffffff; }
    body {
      font-family: 'Satoshi', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: var(--ink);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    /* Halos: luz amarilla difusa, como el hero de soyhenry.com */
    .halo { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; filter: blur(90px); }
    .halo-1 { width: 620px; height: 420px; top: -220px; left: -160px; background: rgba(255, 240, 80, 0.55); }
    .halo-2 { width: 520px; height: 380px; top: -180px; right: -180px; background: rgba(255, 255, 0, 0.35); }
    .halo-3 { width: 480px; height: 320px; bottom: -220px; left: 30%; background: rgba(255, 236, 120, 0.30); }

    header {
      position: relative; z-index: 1;
      max-width: 1100px; margin: 0 auto; padding: 28px 24px;
    }
    header img { display: block; width: 111px; height: 20px; }

    main {
      position: relative; z-index: 1;
      max-width: 640px; margin: 0 auto; padding: 8px 16px 56px;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 13px; font-weight: 500; color: var(--ink);
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid var(--line); border-radius: 999px;
      padding: 6px 12px; margin-bottom: 14px;
      backdrop-filter: blur(6px);
    }
    .badge .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: radial-gradient(120% 120% at 22% 0%, #FFE84D 0%, #FFFF00 38%, #FFDE00 100%);
      box-shadow: 0 0 8px rgba(255, 230, 0, 0.9);
    }
    .intro { text-align: center; }
    h1 {
      font-weight: 700;
      font-size: clamp(1.45rem, 6.6vw, 2.6rem);
      line-height: 1.1;
      white-space: nowrap;
      letter-spacing: -0.025em;
      margin-bottom: 10px;
    }
    .sub {
      font-size: 1.05rem; line-height: 1.5; color: var(--muted);
      margin: 0 auto 24px; white-space: nowrap;
    }
    /* En celular la bajada no entra en una línea a un tamaño legible: ahí sí corta */
    @media (max-width: 600px) { .sub { white-space: normal; font-size: 0.95rem; } }
    .card {
      max-width: 520px; margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 18px 48px -24px rgba(0,0,0,0.18);
      backdrop-filter: blur(10px);
    }

    /* Form de HubSpot (renderRawHtml: el CSS de la página le llega) */
    #hs-form-container .hs-form-field { margin-bottom: 16px !important; }
    #hs-form-container .hs-form-field label {
      font-size: 14px !important; font-weight: 500 !important;
      color: var(--ink) !important; margin-bottom: 6px !important;
      display: block !important; font-family: inherit !important;
    }
    #hs-form-container .hs-form-required { color: var(--muted) !important; margin-left: 2px; }
    #hs-form-container .hs-input {
      background: #ffffff !important; border: 1px solid var(--line) !important;
      border-radius: 12px !important; color: var(--ink) !important;
      padding: 13px 14px !important; font-size: 16px !important;
      width: 100% !important; font-family: inherit !important;
      transition: border-color .15s, box-shadow .15s !important;
    }
    #hs-form-container .hs-input:focus {
      outline: none !important; border-color: #c9c9c4 !important;
      box-shadow: 0 0 0 4px rgba(255, 255, 0, 0.35) !important;
    }
    /* El contenedor del teléfono también trae la clase hs-input: sin esto, borde doble */
    #hs-form-container .hs-fieldtype-intl-phone.hs-input {
      border: none !important; padding: 0 !important; background: transparent !important;
      box-shadow: none !important; display: flex !important; gap: 0 !important;
    }
    #hs-form-container .hs-fieldtype-intl-phone select.hs-input { width: 42% !important; flex: none !important; margin-right: 8px !important; }
    #hs-form-container .hs-fieldtype-intl-phone input[type=hidden] { display: none !important; }
    #hs-form-container .hs-fieldtype-intl-phone input.hs-input { flex: 1 !important; width: auto !important; min-width: 0 !important; }
    #hs-form-container .hs-button {
      background: var(--yellow) !important; color: var(--ink) !important;
      border: none !important; border-radius: 12px !important;
      padding: 15px 20px !important; font-size: 16px !important;
      font-weight: 500 !important; width: 100% !important;
      cursor: pointer !important; font-family: inherit !important;
      margin-top: 6px !important; display: block !important;
      transition: filter .15s !important;
    }
    #hs-form-container .hs-button:hover { filter: brightness(0.96) !important; }
    #hs-form-container .hs-error-msgs {
      list-style: none !important; color: #c62828 !important;
      font-size: 13px !important; margin-top: 6px !important;
    }
    #hs-form-container .hs_submit,
    #hs-form-container .hs_submit .actions { width: 100% !important; }

    /* Después del envío */
    .success { display: none; text-align: center; padding: 8px 0; }
    .success h2 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; }
    .success p { font-size: 1rem; color: var(--muted); margin-bottom: 22px; }
    .program-btn {
      display: block; background: var(--yellow); color: var(--ink);
      font-size: 16px; font-weight: 500; padding: 15px 20px;
      border-radius: 12px; text-decoration: none;
    }
    .program-btn:hover { filter: brightness(0.96); }
  </style>
  <script>!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');fbq('init','441627673220929');fbq('track','PageView');</script>
  <script type="text/javascript" id="hs-script-loader" async defer src="//js.hs-scripts.com/19612811.js"></script>
</head>
<body>

  <div class="halo halo-1"></div>
  <div class="halo halo-2"></div>
  <div class="halo halo-3"></div>

  <header>
    <a href="https://www.soyhenry.com" target="_blank" rel="noopener"><img src="henry-logo.svg" alt="Henry" width="111" height="20" /></a>
  </header>

  <main>
    <div class="intro">
      <span class="badge"><span class="dot"></span>Carrera Full Stack AI</span>
      <h1>Descarga el plan de estudios</h1>
      <p class="sub">Completa tus datos y accede al programa completo, módulo por módulo.</p>
    </div>

    <div class="card">
      <div id="form-wrapper">
        <div id="hs-form-container"></div>
      </div>
      <div class="success" id="success-state">
        <h2>¡Listo!</h2>
        <p>Ya puedes ver el plan de estudios completo.</p>
        <a class="program-btn" id="program-btn" href="https://lp.soyhenry.com/share/lesson/vjYqHFytZRua/s/gRzEJB9QeA6Q" target="_blank" rel="noopener noreferrer">Ver el plan de estudios</a>
      </div>
    </div>
  </main>

  <script>
    var PROGRAMA = 'https://lp.soyhenry.com/share/lesson/vjYqHFytZRua/s/gRzEJB9QeA6Q';

    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name) || '';
    }
    const utms = {
      utm_source:   getParam('utm_source'),
      utm_medium:   getParam('utm_medium'),
      utm_campaign: getParam('utm_campaign'),
      utm_content:  getParam('utm_content'),
      utm_term:     getParam('utm_term'),
    };
    Object.entries(utms).forEach(([k, v]) => { if (v) sessionStorage.setItem(k, v); });
    Object.keys(utms).forEach(k => { if (!utms[k]) utms[k] = sessionStorage.getItem(k) || ''; });

    hbspt.forms.create({
      region: "na1",
      portalId: "19612811",
      formId: "ed490c0e-fc7d-4790-8818-df4a5c8f236b",
      target: "#hs-form-container",
      onFormReady: function(form) {
        setTimeout(() => {
          const btn = form.querySelector('.hs-button');
          if (btn) btn.value = 'Descargar programa';
          const utmMap = {
            'ultima_fuente_utm':  utms.utm_source,
            'ultimo_medio_utm':   utms.utm_medium,
            'ultima_campana_utm': utms.utm_campaign,
            'utm_content':        utms.utm_content,
            'utm_term':           utms.utm_term,
          };
          form.querySelectorAll('input').forEach(input => {
            const n = input.name || '';
            if (utmMap[n] !== undefined) input.value = utmMap[n];
          });
        }, 600);
      },
      onFormSubmit: function() {
        if (window.fbq) fbq('trackCustom', 'Descarga de contenido', { content_name: 'plan-estudios-full-stack' });
        setTimeout(() => {
          document.getElementById('form-wrapper').style.display = 'none';
          document.getElementById('success-state').style.display = 'block';
          window.open(PROGRAMA, '_blank', 'noopener');
        }, 800);
      }
    });
  </script>

</body>
</html>
