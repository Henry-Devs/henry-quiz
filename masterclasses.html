      --black: #111111;
      --white: #ffffff;
      --gray-light: #f5f5f5;
      --gray-mid: #888888;

      max-width: 1120px; margin: 0 auto; padding: 56px 48px 32px; text-align: center;

      line-height: 1.05; margin-bottom: 16px;
    }
    .page-hero h1 mark { background: var(--yellow); color: var(--black); padding: 0 10px; }
    .page-hero p { font-size: 1.05rem; color: var(--gray-dark); max-width: 60ch; margin: 0 auto; line-height: 1.6; }

    /* FILTER CHIPS */
    .filters {
      max-width: 1120px; margin: 32px auto 0; padding: 0 48px;
      display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
    }
    .chip {
      font-family: inherit; font-size: 0.85rem; font-weight: 700; padding: 10px 20px;
      border-radius: 30px; border: 1.5px solid var(--border); background: var(--white);
      color: var(--black); cursor: pointer; transition: all 0.15s ease;
    }
    .chip:hover { border-color: var(--black); }
    .chip.active { background: var(--black); border-color: var(--black); color: var(--white); }

    .next-wrap { max-width: 1120px; margin: 56px auto 0; padding: 0 48px; }
    .next-label {
      font-size: 0.78rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
      color: var(--gray-mid); margin-bottom: 14px;
    }
    .next-card {
      border: 2.5px solid var(--black); border-radius: 24px; overflow: hidden;
      background: var(--white);
    }
    .next-banner { width: 100%; aspect-ratio: 1200 / 628; max-height: 340px; object-fit: cover; display: block; background: var(--gray-light); }
    .next-content {
      display: grid; grid-template-columns: 1.3fr 1fr; gap: 48px; align-items: center;
      padding: 40px 48px;
    }
    .next-badges { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .badge {
      font-size: 0.7rem; font-weight: 800; padding: 6px 14px; border-radius: 20px;
      text-transform: uppercase; letter-spacing: 0.6px;
    }
    .badge.primary { background: var(--yellow); color: var(--black); }
    .badge.outline { border: 1.5px solid var(--border); color: var(--gray-dark); background: var(--white); }
    .next-content h2 {
      font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 900; letter-spacing: -1px;
      line-height: 1.15; margin-bottom: 14px;
    }
    .next-content .next-desc { font-size: 0.98rem; color: var(--gray-dark); line-height: 1.6; margin-bottom: 20px; max-width: 46ch; }
    .next-facts { font-size: 0.88rem; color: var(--gray-dark); line-height: 1.9; }
    .next-facts strong { color: var(--black); }
    .next-side {
      border: 1.5px solid var(--border); border-radius: 18px; padding: 28px; text-align: center;
    }
    .next-side .section-label {
      font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px;
      color: var(--gray-mid); margin-bottom: 14px;

    .next-speakers { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
    .next-speaker-name { font-size: 0.85rem; font-weight: 800; }
    .next-speaker-role { font-size: 0.72rem; color: var(--gray-mid); }
    .next-cta {
      display: inline-block; background: var(--yellow); color: var(--black); font-weight: 800;
      font-size: 0.95rem; padding: 15px 28px; border-radius: 10px; text-decoration: none;
      margin-top: 6px; transition: background 0.15s ease;
    }
    .next-cta:hover { background: var(--yellow-dark); }
    .next-cta-note { font-size: 0.72rem; color: var(--gray-mid); margin-top: 10px; }
    .no-next {
      border: 1.5px dashed var(--border); border-radius: 20px; padding: 40px; text-align: center;
      color: var(--gray-dark);
    }

    .career-section { max-width: 1120px; margin: 64px auto 0; padding: 0 48px; }
    .career-section:last-of-type { margin-bottom: 72px; }

      border-bottom: 1.5px solid var(--border); padding-bottom: 14px;

    .career-count { font-size: 0.8rem; color: var(--gray-mid); font-weight: 600; }

    /* CAROUSEL */
    .mc-carousel-wrap { position: relative; }
    .mc-row {
      display: flex; gap: 24px; overflow-x: auto; scroll-snap-type: x mandatory;
      scroll-behavior: smooth; padding-bottom: 4px;
      -ms-overflow-style: none; scrollbar-width: none;
    }
    .mc-row::-webkit-scrollbar { display: none; }
    .mc-arrow {
      position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px;
      border-radius: 50%; border: 1.5px solid var(--border); background: var(--white);
      cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center;
      z-index: 2; color: var(--black); transition: border-color 0.15s ease;
    }
    .mc-arrow:hover { border-color: var(--black); }
    .mc-arrow.left { left: -20px; }
    .mc-arrow.right { right: -20px; }
    .mc-arrow[hidden] { display: none; }

    .mc-card {
      display: block; text-decoration: none; color: var(--black); flex: 0 0 320px;
      scroll-snap-align: start;
      border: 1.5px solid var(--border); border-radius: 18px; overflow: hidden;
      transition: border-color 0.15s ease, transform 0.15s ease;
      background: var(--white);
    }
    .mc-card:hover { border-color: var(--black); transform: translateY(-2px); }
    .mc-card-top {
      aspect-ratio: 1200 / 628; background: var(--gray-light); position: relative;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .mc-card-top img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .mc-status {
      position: absolute; top: 12px; right: 12px; font-size: 0.65rem; font-weight: 800;
      padding: 5px 11px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.4px;
    }
    .mc-status.future { background: var(--yellow); color: var(--black); }
    .mc-status.past { background: var(--white); color: var(--gray-mid); border: 1px solid var(--border); }
    .mc-card-body { padding: 18px 20px 20px; }
    .mc-date { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--gray-mid); margin-bottom: 8px; }
    .mc-card-body h3 { font-size: 1rem; font-weight: 800; letter-spacing: -0.3px; line-height: 1.3; margin-bottom: 8px; }
    .mc-desc { font-size: 0.8rem; color: var(--gray-dark); line-height: 1.5; margin-bottom: 12px; }
    .mc-speaker { font-size: 0.78rem; color: var(--gray-mid); }
    .mc-speaker strong { color: var(--gray-dark); }

    @media (max-width: 760px) {
      nav { padding: 14px 20px; }
      .page-hero { padding: 40px 20px 24px; }
      .filters { padding: 0 20px; }
      .next-wrap { padding: 0 20px; }
      .next-content { grid-template-columns: 1fr; padding: 28px; gap: 28px; }
      .career-section { padding: 0 20px; }
      .mc-arrow { display: none; }
    }
  </style>
</head>

    const now = Date.now();

    function speakerLabel(speakers) {
      return speakers.length > 1 ? 'Speakers' : 'Speaker';
    }

    function speakerNamesLine(speakers) {
      return speakers.map(s => s.nombre).join(' y ');
    }

    // Próximas primero (de más cercana a menos), después las que ya pasaron
    // (de la más reciente a la más vieja) -- así el swipe hacia la derecha
    // es "ir hacia atrás en el tiempo".
    function ordenarParaCarrusel(items) {
      const futuras = items.filter(m => m.fechaEpoch > now).sort((a, b) => a.fechaEpoch - b.fechaEpoch);
      const pasadas = items.filter(m => m.fechaEpoch <= now).sort((a, b) => b.fechaEpoch - a.fechaEpoch);
      return [...futuras, ...pasadas];
    }

    // ---- FILTROS ----
    const filtersEl = document.getElementById('filters');
    const allChip = document.createElement('button');
    allChip.className = 'chip active';
    allChip.textContent = 'Todas';
    allChip.dataset.carrera = 'todas';
    filtersEl.appendChild(allChip);
    CARRERAS.forEach(c => {
      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.textContent = c;
      chip.dataset.carrera = c;
      filtersEl.appendChild(chip);
    });
    filtersEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.chip');
      if (!btn) return;
      filtersEl.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      const selected = btn.dataset.carrera;
      document.querySelectorAll('.career-section').forEach(sec => {
        sec.style.display = (selected === 'todas' || sec.dataset.carrera === selected) ? '' : 'none';
      });
    });

    // ---- PRÓXIMA MASTERCLASS ----
    const futuras = MASTERCLASSES.filter(m => m.fechaEpoch > now).sort((a, b) => a.fechaEpoch - b.fechaEpoch);
    const nextContainer = document.getElementById('next-mc-container');

    if (futuras.length > 0) {
      const next = futuras[0];
      const card = document.createElement('div');
      card.className = 'next-card';
      card.innerHTML = `
        <img class="next-banner" src="${next.banner}" alt="${next.nombre}" />
        <div class="next-content">
          <div>
            <div class="next-badges">
              <span class="badge primary">En vivo y gratis</span>

                  <div class="next-speaker-role">${s.rol}</div>

          </div>
        </div>

        return `
          <a class="mc-card" href="${m.link}" target="_blank">
            <div class="mc-card-top">
              <img src="${m.banner}" alt="${m.nombre}" />
              <span class="mc-status ${isFuture ? 'future' : 'past'}">${isFuture ? 'Próxima' : 'Ya pasó'}</span>
            </div>
            <div class="mc-card-body">
              <div class="mc-date">${m.fechaCorta}</div>
              <h3>${m.nombre}</h3>
              <p class="mc-desc">${m.desc}</p>
              <p class="mc-speaker"><strong>${speakerLabel(m.speakers)}:</strong> ${speakerNamesLine(m.speakers)}</p>
            </div>
          </a>
        `;
      }).join('');

      section.innerHTML = `
        <div class="career-header">
          <h2>${carrera}</h2>
          <span class="career-count">${items.length} masterclass${items.length > 1 ? 'es' : ''}</span>
        </div>
        <div class="mc-carousel-wrap">
          <button class="mc-arrow left" aria-label="Anteriores" hidden>‹</button>
          <div class="mc-row">${cards}</div>
          <button class="mc-arrow right" aria-label="Siguientes" hidden>›</button>
        </div>
      `;
      sectionsEl.appendChild(section);

      // Flechas del carrusel: solo si hay más items de los que entran en pantalla.
      const row = section.querySelector('.mc-row');
      const leftBtn = section.querySelector('.mc-arrow.left');
      const rightBtn = section.querySelector('.mc-arrow.right');
      const scrollStep = () => (row.querySelector('.mc-card')?.offsetWidth || 320) + 24;
      const updateArrows = () => {
        const hasOverflow = row.scrollWidth > row.clientWidth + 2;
        leftBtn.hidden = !hasOverflow || row.scrollLeft <= 4;
        rightBtn.hidden = !hasOverflow || row.scrollLeft >= row.scrollWidth - row.clientWidth - 4;
      };
      leftBtn.addEventListener('click', () => row.scrollBy({ left: -scrollStep(), behavior: 'smooth' }));
      rightBtn.addEventListener('click', () => row.scrollBy({ left: scrollStep(), behavior: 'smooth' }));
      row.addEventListener('scroll', updateArrows);
      window.addEventListener('resize', updateArrows);
      updateArrows();
    });
  </script>

</body>
</html>
